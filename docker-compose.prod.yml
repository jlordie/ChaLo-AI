version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chalo-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chalo_db
      POSTGRES_INITDB_ARGS: "-E UTF8 -c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chalo-prod-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chalo-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chalo-prod-network

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  chalo-prod-network:
    driver: bridge